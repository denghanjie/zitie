<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正文校勘记录 · 一字一练</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f1;color:#263e30;font:16px/1.75 system-ui,sans-serif}main{max-width:1050px;margin:50px auto;padding:0 24px}h1{font-family:serif;font-weight:500;margin:20px 0 8px}a{color:#32654b}p{max-width:900px}.notice{padding:18px 22px;background:#fff7e5;border-left:4px solid #b78739}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select{font:inherit;border:1px solid #b8c7bc;border-radius:6px;padding:9px;background:white}input{flex:1;min-width:180px}details{background:white;border:1px solid #d9e1d9;border-radius:8px;margin:10px 0;padding:16px}summary{cursor:pointer}.tag{float:right;font-size:13px;color:#697b6c}small{color:#758277}table{border-collapse:collapse;width:100%;font-size:14px;table-layout:fixed}td,th{text-align:left;border-bottom:1px solid #e4e8e3;padding:10px;word-break:break-all}th:first-child{width:10%}.before{color:#9b4233}.after{color:#2b6845}code{word-break:break-all;font-size:12px}button{padding:8px 18px;background:#365d46;color:white;border:0;border-radius:5px;font:inherit}footer{margin:30px 0;color:#758277}summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #92b59d}@media(max-width:600px){.tag{float:none;display:block}main{margin-top:24px}}
</style><main><a href="../">← 返回字帖</a><h1>正文校勘记录</h1><p>每条记录均保留出处、逐字差异与处理状态。校勘尚未全部完成；“文字已对照”仅说明与指定对照本文字一致，不是零差错保证。</p><div class="notice" id="summary" role="status">正在加载校勘清单…</div><div class="filters"><input id="query" aria-label="检索校勘记录" placeholder="篇名、作者或正文差异"><select id="status" aria-label="校勘状态"><option value="all">全部状态</option><option value="pending">待校勘</option><option value="compared">文字已对照</option><option value="retained">版本／节选已记录</option><option value="excerpt">节选范围待核</option><option value="blocked">暂停使用</option></select><select id="scope" aria-label="资料库"><option value="all">全部资料库</option><option value="poetry:">诗词库</option><option value="textbook:">教材库</option></select></div><p id="count" role="status"></p><section id="entries"></section><button id="more" hidden>继续显示 50 条</button><footer>差异偏移量从 0 开始，以 Unicode 字符计。汉字比对与含标点的全部字符比对分别列出；空白与排版换行不计作字误。<br><a href="collation.json">下载完整校勘清单（JSON）</a></footer></main><script src="collation-view.js"></script></html>
