server {
    listen 80;
    listen [::]:80;
    server_name zitie.denghanjie.vip;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://zitie.denghanjie.vip$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zitie.denghanjie.vip;
    root /var/www/zitie/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/zitie.denghanjie.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zitie.denghanjie.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
        client_max_body_size 8k;
        access_log off;
    }
    location /data/ { expires 7d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
